x-athena:
  title: BookStack
  description: A wiki that's simple enough to actually use.
  tagline: "A wiki that's simple enough to actually use."
  tags: [Wiki, Documentation, Knowledge base]
  license: "MIT"
  features:
    - Books, chapters and pages in a clean editor
    - WYSIWYG editing with Markdown support
    - Full-text search across the instance
    - Roles and per-book permissions
    - Exports to HTML, PDF and plain text
  screenshots:
    - https://www.bookstackapp.com/images/screenshots/page-view.png
    - https://www.bookstackapp.com/images/screenshots/page-edit.png
  category: notes
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/bookstack.svg
  homepage: https://www.bookstackapp.com
  web_port: WEB_PORT
  notes: >-
    Sign in as admin@admin.com with the password "password", then change it. If you
    reach Athena from another machine, update APP_URL in the app's .env so links work.
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8091"
    - key: APP_KEY
      label: Encryption key
      type: password
      generate: secret
      advanced: true
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
    - key: DB_ROOT_PASSWORD
      label: Database root password
      type: password
      generate: secret
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:26.09.3
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    environment:
      APP_URL: http://localhost:${WEB_PORT}
      APP_KEY: ${APP_KEY}
      DB_HOST: bookstack-db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
    depends_on:
      - bookstack-db

  bookstack-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/db:/var/lib/mysql
