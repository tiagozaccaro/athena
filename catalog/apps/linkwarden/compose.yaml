x-athena:
  title: Linkwarden
  description: Open-source, self-hosted collaborative bookmark manager for teams and individuals.
  tagline: Collaborative bookmark manager.
  tags: [Bookmarks, Links, Productivity]
  license: "AGPL-3.0"
  category: reading
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Linkwarden/icon.svg
  homepage: https://linkwarden.app
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Linkwarden/thumbnail.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Linkwarden/screenshot-1.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8113"
    - key: NEXTAUTH_SECRET
      label: NextAuth secret
      type: password
      generate: secret
      advanced: true
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
      advanced: true

services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.14.1
    restart: unless-stopped
    depends_on:
      linkwarden-db:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:3000/tcp"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@linkwarden-db:5432/linkwarden
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000/api/v1/auth
    volumes:
      - ${ATHENA_APP_DATA}/data:/data/data

  linkwarden-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkwarden"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
