x-athena:
  title: Stirling-PDF
  description: Merge, split, convert, sign and edit PDFs in your browser.
  tagline: "Merge, split, convert and sign PDFs in the browser."
  tags: [PDF, Tools, Privacy]
  license: "MIT"
  features:
    - Merge, split, rotate and compress PDFs
    - Convert to and from images and Office formats
    - OCR, redaction and watermarking
    - Files never leave your server
  screenshots:
    - https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/docs/images/home-light.png
  category: documents
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/stirling-pdf.svg
  homepage: https://www.stirlingpdf.com
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8085"

services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:3.3.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8080"
    volumes:
      - ${ATHENA_APP_DATA}/configs:/configs
      - ${ATHENA_APP_DATA}/tessdata:/usr/share/tessdata
