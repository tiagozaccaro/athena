x-athena:
  title: Vaultwarden
  description: A lightweight server for the Bitwarden password manager apps.
  category: security
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/vaultwarden.svg
  homepage: https://github.com/dani-garcia/vaultwarden
  web_port: WEB_PORT
  notes: >-
    Bitwarden clients require HTTPS. Put Vaultwarden behind a reverse proxy with a certificate before using the apps.
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8081"
    - key: SIGNUPS_ALLOWED
      label: Allow new sign-ups
      type: boolean
      default: "true"
      description: Turn off after creating your account.
    - key: ADMIN_TOKEN
      label: Admin panel token
      type: password
      description: Used to sign in to /admin. Leave empty to generate one.
      generate: secret

services:
  vaultwarden:
    image: vaultwarden/server:1.34.3-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    environment:
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
