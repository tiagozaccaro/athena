x-athena:
  title: FlowiseAI
  description: Low-code visual builder for AI agent flows and LLM orchestration.
  tagline: Low-code AI agent builder.
  tags: [AI, Low-code, Workflow]
  license: "MIT"
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/FlowiseAi/icon.svg
  homepage: https://flowiseai.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/FlowiseAi/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/FlowiseAi/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8192"
    - key: FLOWISE_USERNAME
      label: Admin username
      type: text
      default: "admin"
      advanced: true
    - key: FLOWISE_PASSWORD
      label: Admin password
      type: password
      generate: secret
      advanced: true

services:
  flowise:
    # 3.1.4 crashes at start (connect-sqlite3 0.9.17, FlowiseAI/Flowise#6688); stay on 3.1.3 until fixed.
    image: flowiseai/flowise:3.1.3
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    environment:
      FLOWISE_USERNAME: ${FLOWISE_USERNAME}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/data:/root/.flowise
