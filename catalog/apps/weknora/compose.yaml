x-athena:
  title: WeKnora
  description: AI-powered knowledge management platform for teams and organizations.
  tagline: AI-powered knowledge management.
  tags: [AI, Knowledge, Team]
  license: "AGPL-3.0"
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/WeKnora/icon.svg
  homepage: https://weknora.com
  web_port: WEB_PORT
  notes: >-
    Register the first account on the sign-in page, then add an LLM and an embedding model under
    Settings (OpenAI-compatible APIs or a local Ollama at http://host.docker.internal:11434).
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/WeKnora/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/WeKnora/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8154"
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
      advanced: true
    - key: REDIS_PASSWORD
      label: Redis password
      type: password
      generate: secret
      advanced: true
    - key: JWT_SECRET
      label: Session secret
      type: password
      generate: secret
      advanced: true
    - key: TENANT_AES_KEY
      label: API key encryption key
      type: password
      generate: hex16
      description: 32-character key that encrypts tenant API keys. Keep it when you reinstall.
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  frontend:
    image: wechatopenai/weknora-ui:v0.2.14
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80/tcp"
    environment:
      MAX_FILE_SIZE_MB: "50"
    depends_on:
      app:
        condition: service_healthy

  app:
    image: wechatopenai/weknora-app:v0.2.14
    restart: unless-stopped
    environment:
      GIN_MODE: release
      DISABLE_REGISTRATION: "false"
      TZ: ${TZ}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: weknora
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: weknora
      RETRIEVE_DRIVER: postgres
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      STREAM_MANAGER_TYPE: redis
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      REDIS_PREFIX: "stream:"
      DOCREADER_ADDR: docreader:50051
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      AUTO_RECOVER_DIRTY: "true"
      ENABLE_GRAPH_RAG: "false"
      TENANT_AES_KEY: ${TENANT_AES_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CONCURRENCY_POOL_SIZE: "5"
      MAX_FILE_SIZE_MB: "50"
    volumes:
      - ${ATHENA_APP_DATA}/files:/data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      docreader:
        condition: service_healthy

  docreader:
    image: wechatopenai/weknora-docreader:v0.2.14
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: paradedb/paradedb:v0.21.4-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: weknora
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: weknora
    volumes:
      - ${ATHENA_APP_DATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weknora -d weknora"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 1m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/redis:/data
