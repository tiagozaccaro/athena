# Imported from the CasaOS AppStore (Apache-2.0): Apps/DeepSeekHarness
x-athena:
  title: DeepSeek Harness
  description: Evaluation framework for DeepSeek and other large language models.
  tagline: LLM evaluation framework.
  tags:
  - AI
  - LLM
  - Evaluation
  license: MIT
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/deepseek.svg
  homepage: https://github.com/DeepSeek-AI/DeepSeek-Harness
  web_port: WEB_PORT
  screenshots:
  - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/DeepSeekHarness/screenshot-1.png
  - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/DeepSeekHarness/screenshot-2.png
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '8180'
  web_path: /
services:
  dsh:
    command: null
    container_name: dsh-harness
    entrypoint: null
    image: ghcr.io/smanx/deepseek-harness:0.2.2-rc.5
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/deepseek.png
    networks:
    - default
    ports:
    - mode: ingress
      target: 3080
      published: ${WEB_PORT}
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}
      target: /root/.dsh
      bind:
        create_host_path: true
