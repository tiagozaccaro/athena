x-athena:
  title: Memos
  description: A lightweight, privacy-first note-taking service.
  tagline: "A lightweight, privacy-first place for quick notes."
  tags: [Notes, Markdown]
  license: "MIT"
  features:
    - One-line notes with Markdown
    - Tags, search and a timeline view
    - Share a note with a public link
    - Single Go binary, SQLite storage
  screenshots:
    - https://raw.githubusercontent.com/usememos/.github/refs/heads/main/assets/previews/timeline-light.png
  category: notes
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/memos.svg
  homepage: https://www.usememos.com
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "5230"

services:
  memos:
    image: neosmemo/memos:stable
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:5230"
    volumes:
      - ${ATHENA_APP_DATA}/data:/var/opt/memos
