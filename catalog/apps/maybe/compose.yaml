x-athena:
  title: Maybe
  description: Personal finance management application
  category: finance
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/maybe.svg
  homepage: https://github.com/maybe-finance/maybe
  web_port: WEB_PORT
  web_path: /
  platforms: [linux/amd64, linux/arm64]
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "23000"
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
      advanced: true
      description: Password for the bundled PostgreSQL database.
    - key: SECRET_KEY_BASE
      label: Secret key base
      type: password
      generate: secret
      advanced: true
      description: Rails secret key base for session encryption.
    - key: OPENAI_ACCESS_TOKEN
      label: OpenAI access token
      type: password
      required: false
      advanced: true
      description: Optional OpenAI API key for AI features.

services:
  maybe-web:
    image: ghcr.io/maybe-finance/maybe:0.6.0
    restart: unless-stopped
    depends_on:
      maybe-db:
        condition: service_healthy
      maybe-redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:3000/tcp"
    environment:
      POSTGRES_USER: maybe_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: maybe_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: maybe-db
      DB_PORT: 5432
      REDIS_URL: redis://maybe-redis:6379/1
      OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN}
    volumes:
      - ${ATHENA_APP_DATA}/app/storage:/rails/storage

  maybe-worker:
    image: ghcr.io/maybe-finance/maybe:0.6.0
    restart: unless-stopped
    depends_on:
      maybe-db:
        condition: service_healthy
      maybe-redis:
        condition: service_healthy
    command: ["bundle", "exec", "sidekiq"]
    environment:
      POSTGRES_USER: maybe_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: maybe_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: maybe-db
      DB_PORT: 5432
      REDIS_URL: redis://maybe-redis:6379/1
      OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN}
    volumes:
      - ${ATHENA_APP_DATA}/app/storage:/rails/storage

  maybe-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maybe_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: maybe_production
    volumes:
      - ${ATHENA_APP_DATA}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maybe_user -d maybe_production"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  maybe-redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - ${ATHENA_APP_DATA}/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  maybe_net:
    driver: bridge