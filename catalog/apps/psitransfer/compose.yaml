x-athena:
  title: PsiTransfer
  description: Simple, self-hosted file sharing application with end-to-end encryption.
  tagline: Simple encrypted file sharing.
  tags: [File Sharing, Transfer, Privacy]
  license: "MIT"
  category: files
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/send.svg
  homepage: https://psitransfer.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/PsiTransfer/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/PsiTransfer/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8127"

services:
  psitransfer:
    image: psitrax/psitransfer:v2.4.1
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
