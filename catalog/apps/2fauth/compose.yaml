x-athena:
  title: 2FAuth
  description: Web-based self-hosted alternative to OTP generators like Google Authenticator.
  tagline: Manage your Two-Factor Authentication (2FA) accounts and generate security codes.
  tags: [2FA, Security, Authentication]
  license: "MIT"
  category: security
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/2FAuth/icon.svg
  homepage: https://2fauth.app
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/2FAuth/thumbnail.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8100"
    - key: APP_KEY
      label: App encryption key
      type: password
      generate: secret

services:
  2fauth:
    image: 2fauth/2fauth:6.1.3
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8000/tcp"
    environment:
      APP_KEY: ${APP_KEY}
    volumes:
      - ${ATHENA_APP_DATA}/data:/2fauth
