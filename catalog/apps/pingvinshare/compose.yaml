x-athena:
  title: Pingvin Share
  description: Open-source file sharing application with support for files, folders, and text.
  tagline: Open-source file sharing.
  tags: [File Sharing, Transfer, Privacy]
  license: "AGPL-3.0"
  category: files
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Pingvin-Share/icon.svg
  homepage: https://pingvin-share.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Pingvin-Share/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Pingvin-Share/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8215"

services:
  pingvin-share:
    image: stonith404/pingvin-share:v1.13.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/app/data
