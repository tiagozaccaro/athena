# Imported from the CasaOS AppStore (Apache-2.0): Apps/TaskingAI
x-athena:
  title: TaskingAI
  description: The developer-friendly cloud platform for building and running LLM agents for AI-native
    applications.
  category: ai
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/TaskingAI/icon.svg
  homepage: https://docs.tasking.ai/
  web_port: 3080
  web_path: /
  platforms:
  - linux/amd64
  - linux/arm64
  notes: 'Sign in as admin with the admin password from the install form. If you left it empty, Athena
    generated one: it''s ADMIN_PASSWORD in the app''s .env.'
  env:
  - key: ADMIN_PASSWORD
    label: Admin password
    type: password
    generate: secret
    description: Password for the admin account. Left empty, a random one is saved in the app's .env.
  - key: DB_PASSWORD
    label: Database and Redis password
    type: password
    generate: secret
    advanced: true
  - key: AES_ENCRYPTION_KEY
    label: Encryption key
    type: password
    generate: hex32
    advanced: true
  - key: JWT_SECRET_KEY
    label: JWT signing key
    type: password
    generate: hex32
    advanced: true
services:
  frontend:
    image: taskingai/taskingai-console:v0.3.0
    depends_on:
    - backend-web
    - backend-api
    networks:
    - taskingai_network
  backend-inference:
    image: taskingai/taskingai-inference:v0.2.14
    environment:
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      ICON_URL_PREFIX: http://nginx:3080
      PROJECT_ID: taskingai
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
    - taskingai_network
  backend-plugin:
    image: taskingai/taskingai-plugin:v0.2.10
    environment:
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      ICON_URL_PREFIX: http://nginx:3080
      OBJECT_STORAGE_TYPE: local
      HOST_URL: http://nginx:3080
      PATH_TO_VOLUME: /var/lib/data
      PROJECT_ID: taskingai
    volumes:
    - ${ATHENA_APP_DATA}/data/object_storage:/var/lib/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
    - taskingai_network
  backend-api:
    image: taskingai/taskingai-server:v0.3.0
    environment:
      POSTGRES_URL: postgres://postgres:${DB_PASSWORD}@db:5432/taskingai
      REDIS_URL: redis://:${DB_PASSWORD}@cache:6379/0
      TASKINGAI_INFERENCE_URL: http://backend-inference:8000
      TASKINGAI_PLUGIN_URL: http://backend-plugin:8000
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      OBJECT_STORAGE_TYPE: local
      HOST_URL: http://nginx:3080
      PATH_TO_VOLUME: /var/lib/data
      PROJECT_ID: taskingai
    volumes:
    - ${ATHENA_APP_DATA}/data/object_storage:/var/lib/data
    depends_on:
    - db
    - cache
    - backend-inference
    - backend-plugin
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
    - taskingai_network
  backend-web:
    image: taskingai/taskingai-server:v0.3.0
    environment:
      POSTGRES_URL: postgres://postgres:${DB_PASSWORD}@db:5432/taskingai
      REDIS_URL: redis://:${DB_PASSWORD}@cache:6379/0
      TASKINGAI_INFERENCE_URL: http://backend-inference:8000
      TASKINGAI_PLUGIN_URL: http://backend-plugin:8000
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PURPOSE: WEB
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OBJECT_STORAGE_TYPE: local
      HOST_URL: http://nginx:3080
      PATH_TO_VOLUME: /var/lib/data
      PROJECT_ID: taskingai
    volumes:
    - ${ATHENA_APP_DATA}/data/object_storage:/var/lib/data
    depends_on:
    - db
    - cache
    - backend-inference
    - backend-plugin
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/v1/health_check
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
    - taskingai_network
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_DB: taskingai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
    - ${ATHENA_APP_DATA}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
    - taskingai_network
  cache:
    image: redis:7-alpine
    command:
    - redis-server
    - --requirepass
    - ${DB_PASSWORD}
    volumes:
    - ${ATHENA_APP_DATA}/data/redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - auth
      - ${DB_PASSWORD}
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
    - taskingai_network
  nginx:
    image: nginx:1.24
    ports:
    - 3080:80
    volumes:
    - ${ATHENA_APP_DATA}/data/nginx_cache:/var/cache/nginx
    depends_on:
    - frontend
    - backend-web
    - backend-api
    networks:
    - taskingai_network
    configs:
    - source: nginx_config
      target: /etc/nginx/conf.d/default.conf
networks:
  taskingai_network:
    driver: bridge
configs:
  nginx_config:
    content: "server {\n  listen 80;\n\n  client_max_body_size 20M;\n\n  location /images/providers/icons/\
      \ {\n      proxy_pass http://backend-inference:8000;\n  }\n\n  location /images/plugins/bundles/icons/\
      \ {\n      proxy_pass http://backend-plugin:8000;\n  }\n\n  location /api/v1/ {\n      proxy_pass\
      \ http://backend-web:8000;\n      proxy_http_version 1.1;\n      proxy_set_header Connection '';\n\
      \      proxy_buffering off;\n      proxy_cache off;\n      proxy_read_timeout 24h;\n  }\n\n  location\
      \ /v1/ {\n      proxy_pass http://backend-api:8000;\n      proxy_http_version 1.1;\n      proxy_set_header\
      \ Connection '';\n      proxy_buffering off;\n      proxy_cache off;\n      proxy_read_timeout 24h;\n\
      \  }\n\n  location /imgs/ {\n      proxy_pass http://backend-web:8000;\n  }\n\n  location / {\n\
      \      proxy_pass http://frontend:80;\n  }\n}\n"
