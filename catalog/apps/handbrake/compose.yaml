x-athena:
  title: Handbrake
  description: Video transcoder for converting video files between formats.
  tagline: Video transcoder.
  tags: [Video, Transcoding]
  license: "GPL-2.0"
  category: media
  platforms: [linux/amd64]
  smoke: skip
  smoke_note: amd64-only image that crashes under emulation on arm64
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Handbrake/icon.svg
  homepage: https://handbrake.fr
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Handbrake/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Handbrake/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8196"
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true

services:
  handbrake:
    image: ghcr.io/linuxserver/handbrake:1.11.2-ls52
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/config:/config
      - ${ATHENA_APP_DATA}/media:/media:ro
