x-athena:
  title: ConvertX
  description: File conversion tool for documents, images, audio, and video formats.
  tagline: File conversion tool.
  tags: [Conversion, Media, Documents]
  license: "MIT"
  category: documents
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/ConvertX/icon.svg
  homepage: https://convertx.app
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/ConvertX/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/ConvertX/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8174"

services:
  convertx:
    image: ghcr.io/c4illin/convertx:v0.20.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
