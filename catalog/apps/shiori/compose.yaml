x-athena:
  title: Shiori
  description: Simple bookmarks manager built with Go.
  tagline: "A simple bookmarks manager with offline copies."
  tags: [Bookmarks, Reading]
  license: "MIT"
  category: reading
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  screenshots:
    - https://raw.githubusercontent.com/go-shiori/shiori/master/docs/assets/screenshots/01-login.png
    - https://raw.githubusercontent.com/go-shiori/shiori/master/docs/assets/screenshots/02-home.png
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/shiori.svg
  homepage: https://go-shiori.shiori.docs
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8095"
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  shiori:
    image: ghcr.io/go-shiori/shiori:v1.8.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8080"
    environment:
      TZ: ${TZ}
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
