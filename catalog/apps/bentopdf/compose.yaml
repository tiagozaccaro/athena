x-athena:
  title: BentoPDF
  description: PDF manipulation tool for merging, splitting, and converting documents.
  tagline: PDF manipulation tool.
  tags: [PDF, Documents, Tools]
  license: "MIT"
  category: documents
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/BentoPDF/icon.svg
  homepage: https://bentopdf.com
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/BentoPDF/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/BentoPDF/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8168"

services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:v2.8.11
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:8080/tcp"
    volumes:
      - ${ATHENA_APP_DATA}/data:/data
