x-athena:
  title: Langflow
  description: Open-source UI for building and debugging multi-agent and RAG applications
  category: ai
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/LangFlow/icon.svg
  homepage: https://www.langflow.org
  web_port: WEB_PORT
  web_path: /
  platforms: [linux/amd64, linux/arm64]
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "17860"
    - key: DB_PASSWORD
      label: Database password
      type: password
      generate: secret
      advanced: true
      description: Password for the bundled PostgreSQL database.

services:
  langflow:
    image: langflowai/langflow:1.9.3
    restart: unless-stopped
    depends_on:
      langflow-postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:7860/tcp"
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:${DB_PASSWORD}@langflow-postgres:5432/langflow
      LANGFLOW_CONFIG_DIR: /app/langflow
    volumes:
      - ${ATHENA_APP_DATA}/backend:/app/langflow

  langflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: langflow
    volumes:
      - ${ATHENA_APP_DATA}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langflow", "-d", "langflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s