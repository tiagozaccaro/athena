x-athena:
  title: ChatGPT Next Web
  description: One-click ChatGPT-style web interface for LLMs with one-click deployment.
  tagline: ChatGPT-style web interface.
  tags: [AI, Chat, LLM]
  license: "MIT"
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/ChatGPT-Next-Web/icon.svg
  homepage: https://chatgpt-next-web.vercel.app
  web_port: WEB_PORT
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/ChatGPT-Next-Web/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/ChatGPT-Next-Web/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8169"
    - key: OPENAI_API_KEY
      label: OpenAI API key
      type: password
      required: false
      advanced: true
    - key: CODE
      label: Access code
      type: password
      description: Leave empty to disable access control.
      required: false
      advanced: true

services:
  chatgpt-next-web:
    image: yidadaa/chatgpt-next-web:v2.16.1
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:3000/tcp"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CODE: ${CODE}
    volumes:
      - ${ATHENA_APP_DATA}/data:/app/data
