x-athena:
  title: Ollama
  description: Run large language models locally with a simple API.
  tagline: "Run large language models locally with one command."
  tags: [LLM, AI, Local]
  license: "MIT"
  popular: true
  features:
    - Pull and run Llama, Qwen, Gemma and other models
    - An OpenAI-compatible API on port 11434
    - Models stay on your hardware
    - The assistant in Athena can use it for free
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Ollama/screenshot-1.png
  category: ai
  platforms: [linux/amd64, linux/arm64]
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/ollama.svg
  homepage: https://ollama.com
  web_port: WEB_PORT
  env:
    - key: WEB_PORT
      label: API port
      type: port
      default: "11434"

services:
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:11434"
    volumes:
      - ${ATHENA_APP_DATA}/ollama:/root/.ollama
