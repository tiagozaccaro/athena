# Imported from the CasaOS AppStore (Apache-2.0): Apps/LibreDBStudio
x-athena:
  title: LibreDB Studio
  description: Open-source self-hosted SQL IDE.
  category: databases
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/LibreDBStudio/icon.svg
  homepage: https://libredb.org
  web_port: WEB_PORT
  web_path: /
  platforms: [linux/amd64, linux/arm64]
  notes: null
  env:
  - key: WEB_PORT
    label: Web port
    type: port
    default: '3016'
services:
  libredb-studio:
    image: libredb/libredb-studio:1.2.0
    container_name: libredb-studio
    restart: unless-stopped
    ports:
    - target: 3000
      published: ${WEB_PORT}
      protocol: tcp
    environment:
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: ''
      JWT_SECRET: ''
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      AUTH_COOKIE_SECURE: 'false'
    volumes:
    - type: bind
      source: ${ATHENA_APP_DATA}/data
      target: /app/data
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('http').get('http://127.0.0.1:3000/api/db/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    privileged: false
