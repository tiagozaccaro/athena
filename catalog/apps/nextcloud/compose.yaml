x-athena:
  title: Nextcloud
  description: Your own cloud for files, calendars, contacts and more.
  category: files
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/nextcloud.svg
  homepage: https://nextcloud.com
  web_port: WEB_PORT
  notes: >-
    Create the admin account on first visit. The database settings are pre-filled from this install.
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8082"
    - key: DB_PASSWORD
      label: Database password
      type: password
      description: Leave empty to generate one.
      generate: secret
    - key: DB_ROOT_PASSWORD
      label: Database root password
      type: password
      description: Leave empty to generate one.
      generate: secret

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/db:/var/lib/mysql
  nextcloud:
    image: nextcloud:31-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${WEB_PORT}:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${ATHENA_APP_DATA}/html:/var/www/html
