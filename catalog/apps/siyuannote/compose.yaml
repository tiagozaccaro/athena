x-athena:
  title: Siyuan Note
  description: Open-source knowledge base with block-level referencing and networked thinking.
  tagline: Open-source knowledge base.
  tags: [Notes, Knowledge, Writing]
  license: "AGPL-3.0"
  category: notes
  platforms: [linux/amd64, linux/arm64, linux/arm/v7]
  icon: https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Siyuan-Note/icon.svg
  homepage: https://siyuan-note.cn
  web_port: WEB_PORT
  notes: >-
    Unlock the workspace with the access code from the install form. If you left it empty, Athena generated one: it's ACCESS_CODE in the app's .env.
  screenshots:
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Siyuan-Note/screenshot-1.png
    - https://raw.githubusercontent.com/IceWhaleTech/CasaOS-AppStore/main/Apps/Siyuan-Note/screenshot-2.png
  env:
    - key: WEB_PORT
      label: Web port
      type: port
      default: "8135"
    - key: ACCESS_CODE
      label: Access code
      type: password
      generate: secret
      description: Password that unlocks the workspace in the browser.
    - key: PUID
      label: User ID
      default: "@uid"
      advanced: true
    - key: PGID
      label: Group ID
      default: "@gid"
      advanced: true
    - key: TZ
      label: Timezone
      default: "@timezone"
      advanced: true

services:
  siyuan:
    image: b3log/siyuan:v3.6.5
    restart: unless-stopped
    command: ["--workspace=/siyuan/workspace/", "--accessAuthCode=${ACCESS_CODE}"]
    ports:
      - "${WEB_PORT}:6806/tcp"
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${ATHENA_APP_DATA}/workspace:/siyuan/workspace
