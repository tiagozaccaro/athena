packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false

permissions:
  '@tanstack/react-table':
    skills: false

# next@16.4.5 pins baseline-browser-mapping@2.10.32 (security advisory: affected < 2.11.0).
# Remove once a Next release depends on a patched version.
overrides:
  baseline-browser-mapping: ^2.11.0
  # Dev tooling only (eslint, shadcn CLI, openapi-typescript); nothing here ships in the UI.
  # brace-expansion < 5.0.12 and minimatch < 11.0.1 have advisories (Dependabot alerts 1-3, 5-7, 9).
  brace-expansion@>=3: ^5.0.13
  minimatch@>=7 <11.0.1: ^11.0.1
