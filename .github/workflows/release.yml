name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Keeps a release PR open with the next version and CHANGELOG.md.
      # PRs opened with GITHUB_TOKEN don't trigger CI, so required checks would never
      # run on the release PR. Set the RELEASE_PLEASE_TOKEN secret (a fine-grained PAT
      # with contents + pull-requests write on this repo) so they do.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the web UI (static export)
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The wheel bundles the exported UI, so `athena serve` serves it at /.
      # The install scripts download athena_server-<version>-py3-none-any.whl.
      - name: Build the server wheel
        run: |
          cp -R apps/web/out apps/server/src/athena/web
          cp -R catalog apps/server/src/athena/catalog_builtin
          cd apps/server
          uv build --wheel --out-dir ../../dist
          ls -l ../../dist

      - name: Check the wheel contains the UI and the catalog
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [p for p in ("athena/web/index.html", "athena/catalog_builtin/apps/jellyfin/compose.yaml") if p not in names]
          sys.exit(f"missing from {wheel}: {missing}" if missing else 0)
          PY

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.whl scripts/install.sh scripts/install.ps1 --clobber
