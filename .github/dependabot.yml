version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) needs Next.js and typescript-eslint support first.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types track the minimum supported Node (engines: >=20.9), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /apps/server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
