version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
