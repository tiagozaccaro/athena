[project]
name = "athena-server"
version = "0.0.0"
description = "Athena: self-hosted home server dashboard for Linux, macOS and Windows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "platformdirs>=4.14",
    "sqlmodel>=0.0.50",
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "python-on-whales>=0.81",
    "pyyaml>=6.0",
    "psutil>=7",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
    "send2trash>=1.8",
    "wsgidav>=4.4.0",
    "a2wsgi>=1.10.10",
    "pydantic-ai-slim[anthropic,bedrock,google,groq,mistral,openai]>=2.68.0",
    "cryptography>=50.0.2",
    "httpx2>=2.16.0",
]

[project.scripts]
athena = "athena.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]
# The release workflow copies the built web UI to src/athena/web and the repo's
# catalog/ to src/athena/catalog_builtin (both gitignored), so they're artifacts.
artifacts = ["src/athena/web/**", "src/athena/catalog_builtin/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
