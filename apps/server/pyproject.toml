[project]
name = "athena-server"
version = "0.0.0"
description = "Athena: self-hosted home server dashboard for Linux, macOS and Windows"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "platformdirs>=4.14",
]

[project.scripts]
athena = "athena.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]
# The web UI is built by the release workflow and copied into src/athena/web
# (gitignored), so it has to be force-included as an artifact.
artifacts = ["src/athena/web/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
